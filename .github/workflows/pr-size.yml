name: PR size

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Label changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changes=$(gh pr view "$PR_NUMBER" --json additions,deletions --jq '.additions + .deletions')
          if (( changes < 10 )); then
            size=XS
            color=0e8a16
          elif (( changes < 100 )); then
            size=S
            color=5ebd3e
          elif (( changes < 500 )); then
            size=M
            color=fbca04
          elif (( changes < 1000 )); then
            size=L
            color=fe7d37
          else
            size=XL
            color=d93f0b
          fi
          target="size/$size"
          gh label create "$target" --color "$color" --description "PR size: $size" --force
          while IFS= read -r label; do
            if [[ "$label" != "$target" ]]; then
              gh pr edit "$PR_NUMBER" --remove-label "$label"
            fi
          done < <(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name | select(startswith("size/"))')
          gh pr edit "$PR_NUMBER" --add-label "$target"
